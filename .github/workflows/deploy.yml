name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # every 3 hours, so new Substack episodes appear without a commit
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: pip install -r requirements.txt
      - name: Sync episodes from Substack
        run: python scripts/sync.py
        continue-on-error: true # keep the last committed data if Substack is down
      - run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
